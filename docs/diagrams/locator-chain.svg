<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 510" width="560" height="510" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrowhead" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <style>
    .step { fill:#eef2ff; stroke:#64748b; stroke-width:1.5; }
    .steptext { font-size:11px; font-weight:600; fill:#334155; }
    .decision { fill:#fff7ed; stroke:#d97706; stroke-width:1.5; stroke-dasharray:4,3; }
    .box { fill:#eef1ff; stroke:#6366f1; stroke-width:1.5; }
    .neutral { fill:#f1f5f9; stroke:#64748b; stroke-width:1.5; }
    .lbl { font-size:11px; fill:#1e1b4b; }
    .edge { fill:none; stroke:#475569; stroke-width:1.5; marker-end:url(#arrow2); }
    .arrowhead { fill:#475569; }
    .caption { font-size:10px; fill:#334155; }
    .title { font-size:13px; font-weight:600; fill:#1e1b4b; }
    .legend { font-size:10px; fill:#64748b; }
    @media (prefers-color-scheme: dark) {
      .step { fill:#312e81; stroke:#94a3b8; }
      .steptext { fill:#e2e8f0; }
      .decision { fill:#451a03; stroke:#fbbf24; }
      .box { fill:#1e1b4b; stroke:#818cf8; }
      .neutral { fill:#1e293b; stroke:#94a3b8; }
      .lbl { fill:#e2e8f0; }
      .edge { stroke:#94a3b8; }
      .arrowhead { fill:#94a3b8; }
      .caption { fill:#cbd5e1; }
      .title { fill:#e2e8f0; }
      .legend { fill:#94a3b8; }
    }
  </style>

  <text class="title" x="20" y="18">Locator priority chain (first match wins)</text>

  <!-- Row 1: data-testid -->
  <circle class="step" cx="34" cy="63" r="15"/>
  <text class="steptext" text-anchor="middle" x="34" y="67">1</text>
  <rect class="decision" x="60" y="40" width="190" height="46" rx="8"/>
  <text class="lbl" text-anchor="middle" x="155" y="67">Has data-testid?</text>
  <path class="edge" d="M250,63 L300,63"/>
  <text class="caption" x="258" y="56">yes</text>
  <rect class="box" x="300" y="40" width="220" height="46" rx="8"/>
  <text class="lbl" text-anchor="middle" x="410" y="67">getByTestId(value)</text>
  <path class="edge" d="M155,86 L155,106"/>
  <text class="caption" x="163" y="100">no</text>

  <!-- Row 2: role/name -->
  <circle class="step" cx="34" cy="129" r="15"/>
  <text class="steptext" text-anchor="middle" x="34" y="133">2</text>
  <rect class="decision" x="60" y="106" width="190" height="46" rx="8"/>
  <text class="lbl" text-anchor="middle" x="155" y="123"><tspan x="155" dy="0">aria-label set, or</tspan><tspan x="155" dy="13">role = button/link?</tspan></text>
  <path class="edge" d="M250,129 L300,129"/>
  <text class="caption" x="258" y="122">yes</text>
  <rect class="box" x="300" y="106" width="220" height="46" rx="8"/>
  <text class="lbl" text-anchor="middle" x="410" y="133">getByRole(role, name)</text>
  <path class="edge" d="M155,152 L155,172"/>
  <text class="caption" x="163" y="166">no</text>

  <!-- Row 3: label -->
  <circle class="step" cx="34" cy="195" r="15"/>
  <text class="steptext" text-anchor="middle" x="34" y="199">3</text>
  <rect class="decision" x="60" y="172" width="190" height="46" rx="8"/>
  <text class="lbl" text-anchor="middle" x="155" y="189"><tspan x="155" dy="0">Has a &lt;label&gt;</tspan><tspan x="155" dy="13">(for= or wrapping)?</tspan></text>
  <path class="edge" d="M250,195 L300,195"/>
  <text class="caption" x="258" y="188">yes</text>
  <rect class="box" x="300" y="172" width="220" height="46" rx="8"/>
  <text class="lbl" text-anchor="middle" x="410" y="199">getByLabel(text)</text>
  <path class="edge" d="M155,218 L155,238"/>
  <text class="caption" x="163" y="232">no</text>

  <!-- Row 4: placeholder -->
  <circle class="step" cx="34" cy="261" r="15"/>
  <text class="steptext" text-anchor="middle" x="34" y="265">4</text>
  <rect class="decision" x="60" y="238" width="190" height="46" rx="8"/>
  <text class="lbl" text-anchor="middle" x="155" y="265">Has placeholder?</text>
  <path class="edge" d="M250,261 L300,261"/>
  <text class="caption" x="258" y="254">yes</text>
  <rect class="box" x="300" y="238" width="220" height="46" rx="8"/>
  <text class="lbl" text-anchor="middle" x="410" y="265">getByPlaceholder(text)</text>
  <path class="edge" d="M155,284 L155,304"/>
  <text class="caption" x="163" y="298">no</text>

  <!-- Row 5: stable id -->
  <circle class="step" cx="34" cy="327" r="15"/>
  <text class="steptext" text-anchor="middle" x="34" y="331">5</text>
  <rect class="decision" x="60" y="304" width="190" height="46" rx="8"/>
  <text class="lbl" text-anchor="middle" x="155" y="321"><tspan x="155" dy="0">Stable id?</tspan><tspan x="155" dy="13">(not hash-like/colon)</tspan></text>
  <path class="edge" d="M250,327 L300,327"/>
  <text class="caption" x="258" y="320">yes</text>
  <rect class="box" x="300" y="304" width="220" height="46" rx="8"/>
  <text class="lbl" text-anchor="middle" x="410" y="331">locator('#id')</text>
  <path class="edge" d="M155,350 L155,370"/>
  <text class="caption" x="163" y="364">no</text>

  <!-- Row 6: name attribute -->
  <circle class="step" cx="34" cy="393" r="15"/>
  <text class="steptext" text-anchor="middle" x="34" y="397">6</text>
  <rect class="decision" x="60" y="370" width="190" height="46" rx="8"/>
  <text class="lbl" text-anchor="middle" x="155" y="387"><tspan x="155" dy="0">Has name</tspan><tspan x="155" dy="13">attribute?</tspan></text>
  <path class="edge" d="M250,393 L300,393"/>
  <text class="caption" x="258" y="386">yes</text>
  <rect class="box" x="300" y="370" width="220" height="46" rx="8"/>
  <text class="lbl" text-anchor="middle" x="410" y="393">locator('[name="x"]')</text>
  <path class="edge" d="M155,416 L155,426 L290,426 L290,436"/>
  <text class="caption" x="163" y="422">no</text>

  <!-- Row 7: CSS fallback (final, no decision) -->
  <circle class="step" cx="34" cy="459" r="15"/>
  <text class="steptext" text-anchor="middle" x="34" y="463">7</text>
  <rect class="neutral" x="60" y="436" width="460" height="46" rx="8"/>
  <text class="lbl" text-anchor="middle" x="290" y="463">CSS fallback: #parentId tag, or bare tag</text>

  <text class="legend" x="20" y="500">dashed = condition checked in order &#183; solid = resulting Playwright locator call</text>
</svg>
