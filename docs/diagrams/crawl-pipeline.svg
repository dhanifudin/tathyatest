<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="860" height="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrowhead" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <style>
    .box { fill:#eef1ff; stroke:#6366f1; stroke-width:1.5; }
    .decision { fill:#fff7ed; stroke:#d97706; stroke-width:1.5; stroke-dasharray:4,3; }
    .terminal { fill:#ecfdf5; stroke:#059669; stroke-width:1.5; }
    .fail { fill:#fef2f2; stroke:#dc2626; stroke-width:1.5; }
    .lbl { font-size:11.5px; fill:#1e1b4b; }
    .edge { fill:none; stroke:#475569; stroke-width:1.5; marker-end:url(#arrow); }
    .arrowhead { fill:#475569; }
    .caption { font-size:10.5px; fill:#334155; }
    .title { font-size:13px; font-weight:600; fill:#1e1b4b; }
    .legend { font-size:10px; fill:#64748b; }
    @media (prefers-color-scheme: dark) {
      .box { fill:#1e1b4b; stroke:#818cf8; }
      .decision { fill:#451a03; stroke:#fbbf24; }
      .terminal { fill:#022c22; stroke:#34d399; }
      .fail { fill:#450a0a; stroke:#f87171; }
      .lbl { fill:#e2e8f0; }
      .edge { stroke:#94a3b8; }
      .arrowhead { fill:#94a3b8; }
      .caption { fill:#cbd5e1; }
      .title { fill:#e2e8f0; }
      .legend { fill:#94a3b8; }
    }
  </style>

  <text class="title" x="20" y="14">Crawl loop (per role)</text>

  <!-- Login phase -->
  <rect class="box" x="20" y="26" width="150" height="58" rx="10"/>
  <text class="lbl" text-anchor="middle" x="95" y="48.5"><tspan x="95" dy="0">Launch Chromium,</tspan><tspan x="95" dy="13">open page per role</tspan></text>

  <rect class="box" x="190" y="26" width="150" height="58" rx="10"/>
  <text class="lbl" text-anchor="middle" x="265" y="48.5"><tspan x="265" dy="0">Fill inferred</tspan><tspan x="265" dy="13">login controls</tspan></text>

  <rect class="box" x="360" y="26" width="230" height="58" rx="10"/>
  <text class="lbl" text-anchor="middle" x="475" y="48.5"><tspan x="475" dy="0">Wait: URL change or submit,</tspan><tspan x="475" dy="13">then wait for hydration</tspan></text>

  <rect class="decision" x="610" y="26" width="230" height="58" rx="10"/>
  <text class="lbl" text-anchor="middle" x="725" y="48.5"><tspan x="725" dy="0">Login form</tspan><tspan x="725" dy="13">still visible?</tspan></text>

  <rect class="fail" x="655" y="96" width="140" height="40" rx="8"/>
  <text class="lbl" text-anchor="middle" x="725" y="112.5"><tspan x="725" dy="0">Throw:</tspan><tspan x="725" dy="13">login failed</tspan></text>

  <!-- Login row edges -->
  <path class="edge" d="M170,55 L190,55"/>
  <path class="edge" d="M340,55 L360,55"/>
  <path class="edge" d="M590,55 L610,55"/>
  <path class="edge" d="M725,84 L725,96"/>
  <text class="caption" x="733" y="92">yes</text>
  <path class="edge" d="M650,84 L650,146 L95,146 L95,160"/>
  <text class="caption" x="370" y="143">no</text>

  <!-- Top loop row -->
  <rect class="box" x="20" y="160" width="150" height="58" rx="10"/>
  <text class="lbl" text-anchor="middle" x="95" y="182.5"><tspan x="95" dy="0">Dequeue</tspan><tspan x="95" dy="13">next URL</tspan></text>

  <rect class="box" x="190" y="160" width="150" height="58" rx="10"/>
  <text class="lbl" text-anchor="middle" x="265" y="182.5"><tspan x="265" dy="0">page.goto()</tspan><tspan x="265" dy="13">+ wait hydration</tspan></text>

  <rect class="box" x="360" y="160" width="230" height="58" rx="10"/>
  <text class="lbl" text-anchor="middle" x="475" y="176"><tspan x="475" dy="0">page.evaluate(): extract</tspan><tspan x="475" dy="13">forms, links, buttons,</tspan><tspan x="475" dy="13">tables &amp; controls</tspan></text>

  <rect class="box" x="610" y="160" width="230" height="58" rx="10"/>
  <text class="lbl" text-anchor="middle" x="725" y="182.5"><tspan x="725" dy="0">ariaSnapshot(): enrich</tspan><tspan x="725" dy="13">css/name locators &#8594; role</tspan></text>

  <!-- Top loop row edges -->
  <path class="edge" d="M170,189 L190,189"/>
  <path class="edge" d="M340,189 L360,189"/>
  <path class="edge" d="M590,189 L610,189"/>
  <path class="edge" d="M725,218 L725,290"/>

  <!-- Bottom loop row -->
  <rect class="terminal" x="20" y="290" width="150" height="58" rx="10"/>
  <text class="lbl" text-anchor="middle" x="95" y="312.5"><tspan x="95" dy="0">Write</tspan><tspan x="95" dy="13">crawl/&lt;role&gt;.json</tspan></text>

  <rect class="decision" x="190" y="290" width="150" height="58" rx="10"/>
  <text class="lbl" text-anchor="middle" x="265" y="312.5"><tspan x="265" dy="0">Queue</tspan><tspan x="265" dy="13">empty?</tspan></text>

  <rect class="decision" x="360" y="290" width="230" height="58" rx="10"/>
  <text class="lbl" text-anchor="middle" x="475" y="306"><tspan x="475" dy="0">Unseen, within</tspan><tspan x="475" dy="13">maxPages/maxDepth,</tspan><tspan x="475" dy="13">not excluded?</tspan></text>

  <rect class="box" x="610" y="290" width="230" height="58" rx="10"/>
  <text class="lbl" text-anchor="middle" x="725" y="306"><tspan x="725" dy="0">Discover same-origin URLs</tspan><tspan x="725" dy="13">(&lt;a&gt; href, GET form actions,</tspan><tspan x="725" dy="13">data-href/url/route/to)</tspan></text>

  <!-- Bottom loop row edges -->
  <path class="edge" d="M610,319 L590,319"/>
  <path class="edge" d="M360,319 L340,319"/>
  <text class="caption" x="343" y="308">no</text>
  <path class="edge" d="M190,319 L170,319"/>
  <text class="caption" x="173" y="308">yes</text>

  <!-- loop-back edges -->
  <path class="edge" d="M400,290 L400,245 L130,245 L130,218"/>
  <text class="caption" x="200" y="241">yes &#8594; enqueue</text>
  <path class="edge" d="M230,290 L230,260 L60,260 L60,218"/>
  <text class="caption" x="90" y="256">no &#8594; next</text>

  <text class="legend" x="20" y="372">solid = step &#183; dashed = decision &#183; green = write output &#183; red = login failure</text>
</svg>
